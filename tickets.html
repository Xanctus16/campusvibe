<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TagLine — My Tickets</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0c1020;--panel:#151b30;--panel2:#1c2440;--text:#f4f6ff;--muted:#aeb8d4;--accent:#ff7b36;--line:#2b3454;--green:#61d6a4}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 80% 0,#25204d 0,transparent 35%),var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--text);min-height:100vh}
a{text-decoration:none;color:inherit}
.wrap{max-width:1180px;margin:auto;padding:20px;position:relative}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0 22px;position:relative}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;color:var(--text)}
.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--accent),#ffcb69);display:grid;place-items:center;color:#261306;font-size:21px}
.brand small{display:block;font-size:10px;letter-spacing:1.6px;color:var(--muted);font-weight:700}

/* Standardized Navigation Header */
.nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.nav a{padding:10px 14px;border-radius:12px;color:var(--muted);font-weight:700;font-size:13px;transition:all 0.2s}
.nav a:hover{color:var(--text);background:var(--panel2)}
.nav a.active{background:var(--panel2);color:white}
.nav a.logout-btn{color:#ffb38b;border:1px solid rgba(255,123,54,0.2)}
.nav a.logout-btn:hover{background:rgba(255,123,54,0.1)}

/* Mobile Hamburger Toggle Button */
.menu-toggle {
  display: none;
  background: var(--panel2);
  border: 1px solid var(--line);
  color: var(--text);
  font-size: 1.25rem;
  padding: 8px 12px;
  border-radius: 12px;
  cursor: pointer;
}

.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:28px 0 14px}
.ticket{background:#fff;color:#171827;border-radius:18px;padding:20px;max-width:420px;margin:14px 0;position:relative;box-shadow:0 10px 30px rgba(0,0,0,0.4)}
.ticketlogo{font-weight:950;color:#ea672f;font-size:12px;margin-bottom:8px;display:flex;justify-content:space-between}
.badge{padding:4px 8px;border-radius:6px;font-size:10px;font-weight:800;text-transform:uppercase}
.badge.valid{background:#e6f7f0;color:#108a55}
.badge.used{background:#ffebe6;color:#d9381e}
.tier-badge{display:inline-block;background:#151b30;color:#ff7b36;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:800;margin-top:8px}
.empty{padding:32px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}
.footer{color:#7782a4;font-size:12px;text-align:center;padding:30px 0 10px}

/* Toast Notification Styles */
.cv-toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.cv-toast { pointer-events: auto; background: rgba(21, 27, 48, 0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 18px; padding: 14px 18px; min-width: 300px; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: flex-start; gap: 12px; animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; position: relative; }
.cv-toast-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); display: grid; place-items: center; font-size: 18px; flex-shrink: 0; }
.cv-toast-content { flex: 1; }
.cv-toast-tag { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: var(--green); margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
.cv-toast-tag::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--green); display: inline-block; box-shadow: 0 0 8px var(--green); }
.cv-toast-title { font-size: 13px; font-weight: 700; color: var(--text); margin: 0 0 2px 0; }
.cv-toast-time { font-size: 10px; color: var(--muted); font-weight: 600; }
.cv-toast-close { background: transparent; border: 0; color: var(--muted); font-size: 18px; padding: 0; cursor: pointer; line-height: 1; }
@keyframes slideIn { from { opacity: 0; transform: translateY(-20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes slideOut { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(-20px) scale(0.95); } }

/* Mobile Navigation Breakpoint */
@media(max-width:850px){
  .menu-toggle { display: block; }
  .nav {
    display: none;
    flex-direction: column;
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.8);
    z-index: 1000;
    align-items: stretch;
    justify-content: flex-start;
  }
  .nav.active { display: flex; }
  .nav a { justify-content: center; padding: 12px; font-size: 14px; width: 100%; text-align: center; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a href="index.html" class="brand">
      <div class="logo">✦</div>
      <div>TagLine <small>SEAMLESS ACCESS</small></div>
    </a>
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle Navigation">☰</button>
    <nav class="nav" id="navLinks"></nav>
  </header>

  <div class="sectionhead">
    <div><h2>My tickets & Passes</h2><p>Your saved event tickets and reserved table passes.</p></div>
  </div>

  <div id="ticketList"></div>

  <div class="footer">TagLine • Seamless Access</div>
</div>

<script>
  // Mobile Menu Toggle Script
  const menuToggle = document.getElementById('menuToggle');
  const navLinksEl = document.getElementById('navLinks');
  if (menuToggle && navLinksEl) {
    menuToggle.addEventListener('click', () => {
      navLinksEl.classList.toggle('active');
      menuToggle.textContent = navLinksEl.classList.contains('active') ? '✕' : '☰';
    });
  }

  // 1. Route Security Check
  let user = null;
  try {
    user = JSON.parse(localStorage.getItem('cv_user') || 'null');
  } catch(e) { user = null; }

  if (!user) {
    window.location.href = 'login.html';
  }

  const SUPABASE_URL = 'https://ylbqwgigsvdrglgjcpyu.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlsYnF3Z2lnc3ZkcmdsZ2pjcHl1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2NDQ1OTUsImV4cCI6MjEwODIyMDU5NX0.VjhL9UjElDZTdyjM3tX7qnk-8U_Qgrehq6yxkeVLELw';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function logout() {
    localStorage.removeItem('cv_user');
    supabaseClient.auth.signOut();
    window.location.href = 'index.html';
  }

  function renderNavbar() {
    const nav = document.getElementById('navLinks');
    if (!nav) return;

    const isOrganizer = user && (user.role === 'organizer' || user.is_organizer === true);

    if (isOrganizer) {
      nav.innerHTML = `
        <a href="index.html">Discover</a>
        <a href="tickets.html" class="active">My Tickets</a>
        <a href="organizers.html">Organizers</a>
        <a href="organizer_dashboard.html">Dashboard</a>
        <a href="organizer.html">＋ Create Event</a>
        <a href="verify.html">Scan Tickets</a>
        <a href="#" onclick="logout()" class="logout-btn">Logout (${esc(user.nickname || user.name || 'User')})</a>
      `;
    } else {
      nav.innerHTML = `
        <a href="index.html">Discover</a>
        <a href="tickets.html" class="active">My Tickets</a>
        <a href="organizers.html">Organizers</a>
        <a href="#" onclick="logout()" class="logout-btn">Logout (${esc(user.nickname || user.name || 'User')})</a>
      `;
    }
  }

  function niceDate(d){ return !d ? 'Date TBA' : new Date(d+'T12:00:00').toLocaleDateString('en-NG',{day:'numeric',month:'short',year:'numeric'}); }
  function money(n){ return Number(n)===0?'Free':'₦'+Number(n).toLocaleString('en-NG'); }
  function esc(s){ return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  function renderTickets(){
    let tickets = JSON.parse(localStorage.getItem('cv_tickets') || '[]');
    let box = document.getElementById('ticketList');

    if(!tickets.length){
      box.innerHTML = '<div class="empty">No passes or tables booked yet. Check out events on the <a href="index.html" style="color:var(--accent)">Discover</a> page!</div>';
      return;
    }

    box.innerHTML = tickets.slice().reverse().map(t=>`
      <div class="ticket">
        <div class="ticketlogo">
          <span>TAGLINE / ENTRY PASS</span>
          <span class="badge ${t.status === 'used' ? 'used' : 'valid'}">${t.status === 'used' ? 'USED' : 'VALID'}</span>
        </div>
        <h2 style="margin:0 0 6px">${esc(t.name)}</h2>
        <div class="tier-badge">🏷️ ${esc(t.tier_name || 'Regular Pass')} • ${money(t.price || 0)}</div>
        <p style="margin:12px 0 0;color:#444">
          📅 ${niceDate(t.date)}<br>
          📍 ${esc(t.venue)}<br>
          🎓 ${esc(t.campus)}<br>
          Reference Code: <strong>${esc(t.id)}</strong>
        </p>
      </div>`).join('');
  }

  renderNavbar();
  renderTickets();
</script>
</body>
</html>
