<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organizer Dashboard — VibePass</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0c1020;--panel:#151b30;--panel2:#1c2440;--text:#f4f6ff;--muted:#aeb8d4;--accent:#ff7b36;--accent2:#8c7bff;--green:#61d6a4;--line:#2b3454}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 80% 0,#25204d 0,transparent 35%),var(--bg);font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--text)}
a{text-decoration:none}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:12px;padding:10px 14px;font-weight:750;background:var(--accent);color:#20120b;transition:filter 0.2s}
button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
button:hover{filter:brightness(1.08)}
.wrap{max-width:1280px;margin:auto;padding:20px;position:relative}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;position:relative}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;letter-spacing:-.5px;cursor:pointer;flex-shrink:0;color:var(--text)}
.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--accent),#ffcb69);display:grid;place-items:center;color:#261306;font-size:21px}
.brand small{display:block;font-size:10px;letter-spacing:1.6px;color:var(--muted);font-weight:700}

/* Standardized Navigation Header */
.nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.nav a{background:transparent;color:var(--muted);padding:8px 12px;border-radius:12px;font-weight:750;display:inline-flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;border:1px solid transparent;transition:all 0.2s;white-space:nowrap;line-height:1.2}
.nav a:hover{color:var(--text);border-color:var(--line);background:var(--panel2)}
.nav a.active{background:var(--panel2);color:white;border-color:var(--line)}
.nav a.logout-btn{color:#ffb38b;border-color:rgba(255,123,54,0.2)}
.nav a.logout-btn:hover{background:rgba(255,123,54,0.1)}

/* Mobile Hamburger Toggle Button */
.menu-toggle {
  display: none;
  background: var(--panel2);
  border: 1px solid var(--line);
  color: var(--text);
  font-size: 1.25rem;
  padding: 8px 12px;
  border-radius: 12px;
  cursor: pointer;
}

.dashboard-head{margin:20px 0 24px}
.dashboard-head h1{font-size:28px;letter-spacing:-1px;margin:0 0 6px 0}
.dashboard-head p{color:var(--muted);margin:0;font-size:14px}

.stats-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:28px}
.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}
.stat-card .label{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px}
.stat-card .value{font-size:28px;font-weight:900;margin-top:6px;color:var(--text)}

.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 16px}
.sectionhead h2{margin:0;font-size:22px;letter-spacing:-.5px}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}
.card h3{margin:0;font-size:18px}
.meta{color:var(--muted);font-size:13px;display:flex;gap:10px;flex-wrap:wrap}
.empty{padding:32px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px;grid-column:1/-1}

.footer{color:#7782a4;font-size:12px;text-align:center;padding:30px 0 10px}

/* Toast Notification Banner */
.cv-toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.cv-toast { pointer-events: auto; background: rgba(21, 27, 48, 0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 18px; padding: 14px 18px; min-width: 300px; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: flex-start; gap: 12px; animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; position: relative; }
.cv-toast-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); display: grid; place-items: center; font-size: 18px; flex-shrink: 0; }
.cv-toast-content { flex: 1; }
.cv-toast-tag { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: var(--green); margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
.cv-toast-tag::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--green); display: inline-block; box-shadow: 0 0 8px var(--green); }
.cv-toast-title { font-size: 13px; font-weight: 700; color: var(--text); margin: 0 0 2px 0; }
.cv-toast-time { font-size: 10px; color: var(--muted); font-weight: 600; }
.cv-toast-close { background: transparent; border: 0; color: var(--muted); font-size: 18px; padding: 0; cursor: pointer; line-height: 1; }
@keyframes slideIn { from { opacity: 0; transform: translateY(-20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes slideOut { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(-20px) scale(0.95); } }

/* Mobile Navigation Breakpoint */
@media(max-width:850px){
  .menu-toggle { display: block; }
  .nav {
    display: none;
    flex-direction: column;
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.8);
    z-index: 1000;
    align-items: stretch;
    justify-content: flex-start;
  }
  .nav.active { display: flex; }
  .nav a { justify-content: center; padding: 12px; font-size: 14px; width: 100%; }
  .stats-grid { grid-template-columns: 1fr; }
  .grid { grid-template-columns: 1fr; }
}
@media(max-width:520px){
  .wrap{padding:13px}
}
</style>
</head>
<body>

<div class="wrap">
<header class="top">
  <a href="index.html" class="brand">
    <div class="logo">✦</div>
    <div>VibePass <small>SEAMLESS ACCESS</small></div>
  </a>
  <button class="menu-toggle" id="menuToggle" aria-label="Toggle Navigation">☰</button>
  <nav class="nav" id="navLinks"></nav>
</header>

<div class="dashboard-head">
  <h1>📊 Organizer Dashboard</h1>
  <p>Track performance, ticket sales, and events hosted under your brand.</p>
</div>

<div class="stats-grid">
  <div class="stat-card">
    <div class="label">Total Events Hosted</div>
    <div class="value" id="statEvents">0</div>
  </div>
  <div class="stat-card">
    <div class="label">Tickets Issued</div>
    <div class="value" id="statTickets">0</div>
  </div>
  <div class="stat-card">
    <div class="label">Total Revenue</div>
    <div class="value" id="statRevenue">₦0</div>
  </div>
</div>

<div class="sectionhead">
  <h2>Your Published Events</h2>
  <button onclick="window.location.href='organizer.html'">＋ Create New Event</button>
</div>

<div class="grid" id="myEventsGrid"></div>

<div class="footer">VibePass • Seamless Access</div>
</div>

<script>
  const SUPABASE_URL = 'https://ylbqwgigsvdrglgjcpyu.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlsYnF3Z2lnc3ZkcmdsZ2pjcHl1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2NDQ1OTUsImV4cCI6MjEwODIyMDU5NX0.VjhL9UjElDZTdyjM3tX7qnk-8U_Qgrehq6yxkeVLELw';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Mobile Menu Toggle Script
  const menuToggle = document.getElementById('menuToggle');
  const navLinksEl = document.getElementById('navLinks');
  if (menuToggle && navLinksEl) {
    menuToggle.addEventListener('click', () => {
      navLinksEl.classList.toggle('active');
      menuToggle.textContent = navLinksEl.classList.contains('active') ? '✕' : '☰';
    });
  }

  function showToast(badgeText, title, icon = '✦') {
    let container = document.getElementById('toastContainer');
    if (!container) {
      container = document.createElement('div');
      container.id = 'toastContainer';
      container.className = 'cv-toast-container';
      document.body.appendChild(container);
    }

    const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const toast = document.createElement('div');
    toast.className = 'cv-toast';
    
    toast.innerHTML = `
      <div class="cv-toast-icon">${icon}</div>
      <div class="cv-toast-content">
        <div class="cv-toast-tag">${badgeText}</div>
        <div class="cv-toast-title">${title}</div>
        <div class="cv-toast-time">${now}</div>
      </div>
      <button class="cv-toast-close" onclick="this.parentElement.remove()">×</button>
    `;

    container.appendChild(toast);

    setTimeout(() => {
      toast.style.animation = 'slideOut 0.3s forwards';
      setTimeout(() => toast.remove(), 300);
    }, 5000);
  }

  function renderNavbar() {
    let user = null;
    try {
      user = JSON.parse(localStorage.getItem('cv_user') || 'null');
    } catch(e) { user = null; }

    const nav = document.getElementById('navLinks');
    if (!nav) return;

    if (!user) {
      window.location.href = 'login.html';
      return;
    }

    if (user.role === 'organizer') {
      nav.innerHTML = `
        <a href="index.html">Discover</a>
        <a href="tickets.html">My Tickets</a>
        <a href="organizers.html">Organizers</a>
        <a href="organizer_dashboard.html" class="active">Dashboard</a>
        <a href="organizer.html">＋ Create Event</a>
        <a href="verify.html">Scan Tickets</a>
        <a href="#" onclick="logout()" class="logout-btn">Logout (${esc(user.nickname)})</a>
      `;
    } else {
      nav.innerHTML = `
        <a href="index.html">Discover</a>
        <a href="tickets.html">My Tickets</a>
        <a href="organizers.html">Organizers</a>
        <a href="#" onclick="logout()" class="logout-btn">Logout (${esc(user.nickname)})</a>
      `;
    }
  }

  function esc(s){ return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function niceDate(d){ if(!d)return 'Date TBA'; return new Date(d+'T12:00:00').toLocaleDateString('en-NG',{day:'numeric',month:'short',year:'numeric'}); }
  function money(n){ return Number(n)===0?'Free':'₦'+Number(n).toLocaleString('en-NG'); }

  function logout() {
    localStorage.removeItem('cv_user');
    supabaseClient.auth.signOut();
    sessionStorage.setItem('cv_flash_toast', JSON.stringify({
      tag: 'AUTHENTICATION',
      msg: 'Logged out successfully.',
      icon: '🔒'
    }));
    window.location.href = 'login.html';
  }

  async function loadDashboardData() {
    let user = null;
    try { user = JSON.parse(localStorage.getItem('cv_user') || 'null'); } catch(e) { user = null; }

    if (!user) {
      window.location.href = 'login.html';
      return;
    }

    // Fetch organizer's events from Supabase
    const { data: myEvents, error } = await supabaseClient
      .from('events')
      .select('*')
      .eq('organizer_id', user.id);

    if (error) {
      console.error('Error fetching dashboard events:', error);
      return;
    }

    const eventsList = myEvents || [];
    document.getElementById('statEvents').textContent = eventsList.length;

    // Fetch total tickets issued for organizer's events
    const eventIds = eventsList.map(e => e.id);
    let totalTickets = 0;
    let totalRevenue = 0;

    if (eventIds.length > 0) {
      const { data: ticketsData } = await supabaseClient
        .from('tickets')
        .select('*, events(price)')
        .in('event_id', eventIds);

      if (ticketsData) {
        totalTickets = ticketsData.length;
        ticketsData.forEach(t => {
          const price = t.events ? Number(t.events.price || 0) : 0;
          totalRevenue += price;
        });
      }
    }

    document.getElementById('statTickets').textContent = totalTickets;
    document.getElementById('statRevenue').textContent = money(totalRevenue);

    // Render event list
    const grid = document.getElementById('myEventsGrid');
    grid.innerHTML = '';

    if (!eventsList.length) {
      grid.innerHTML = '<div class="empty">You have not created any events yet. Tap "Create New Event" above to get started!</div>';
      return;
    }

    eventsList.forEach(e => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <h3>${esc(e.name)}</h3>
        <div class="meta">
          <span>📍 ${esc(e.campus)}</span>
          <span>📅 ${niceDate(e.date)}</span>
          <span>🎟️ ${money(e.price)}</span>
        </div>
        <p style="color:var(--muted);font-size:13px;margin:0;">${esc(e.venue)}</p>
        <div style="display:flex;gap:8px;margin-top:auto;padding-top:10px;">
          <button class="secondary" style="flex:1;" onclick="window.location.href='verify.html'">Scan Door Tickets</button>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  renderNavbar();
  loadDashboardData();
</script>
</body>
</html>
