<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tag Line — Host Event</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0c1020;--panel:#151b30;--panel2:#1c2440;--text:#f4f6ff;--muted:#aeb8d4;--accent:#ff7b36;--green:#61d6a4;--line:#2b3454}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 80% 0,#25204d 0,transparent 35%),var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--text);min-height:100vh}
a{text-decoration:none;color:inherit}
button,input,select,textarea{font:inherit}
button,.btn{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;font-weight:750;background:var(--accent);color:#20120b;transition:filter 0.2s}
button.secondary,.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
button:hover,.btn:hover{filter:brightness(1.08)}
.wrap{max-width:760px;margin:auto;padding:20px;position:relative}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0 22px;position:relative}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;color:var(--text)}
.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--accent),#ffcb69);display:grid;place-items:center;color:#261306;font-size:21px}
.brand small{display:block;font-size:10px;letter-spacing:1.6px;color:var(--muted);font-weight:700}

.nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.nav a{padding:10px 14px;border-radius:12px;color:var(--muted);font-weight:700;font-size:13px}
.nav a.active{background:var(--panel2);color:white}

.menu-toggle { display: none; background: var(--panel2); border: 1px solid var(--line); color: var(--text); font-size: 1.25rem; padding: 8px 12px; border-radius: 12px; cursor: pointer; }

.box{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 12px 30px rgba(0,0,0,0.3)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.field label{font-size:12px;color:var(--muted);font-weight:750}
.field input,.field select,.field textarea{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--text);outline:none;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}

/* Tier Builder Styles */
.tier-builder{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:18px}
.tier-row{display:grid;grid-template-columns:1.5fr 1fr 40px;gap:10px;align-items:center;margin-bottom:10px}
.tier-row:last-child{margin-bottom:0}
.remove-tier{background:rgba(255,82,82,0.15);color:#ff5252;border:1px solid rgba(255,82,82,0.3);border-radius:10px;height:42px;display:grid;place-items:center;padding:0;cursor:pointer}

.footer{color:#7782a4;font-size:12px;text-align:center;padding:30px 0 10px}

@media(max-width:850px){
  .menu-toggle { display: block; }
  .nav { display: none; flex-direction: column; position: absolute; top: 100%; left: 0; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; z-index: 1000; }
  .nav.active { display: flex; }
  .tier-row { grid-template-columns: 1fr; }
  .remove-tier { height: 38px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a href="index.html" class="brand">
      <div class="logo">✦</div>
      <div>Tag Line <small>SEAMLESS ACCESS</small></div>
    </a>
    <button class="menu-toggle" id="menuToggle">☰</button>
    <nav class="nav" id="navLinks">
      <a href="index.html">Discover</a>
      <a href="organizer_dashboard.html">Dashboard</a>
      <a href="organizer.html" class="active">＋ Create Event</a>
      <a href="verify.html">Scan Tickets</a>
    </nav>
  </header>

  <div class="box">
    <h1 style="margin:0 0 6px">Host New Event</h1>
    <p style="color:var(--muted);font-size:14px;margin:0 0 24px">Configure event details and ticket/table tiers.</p>

    <form id="createEventForm">
      <div class="field">
        <label>Event Name *</label>
        <input type="text" id="eventName" required placeholder="e.g. Campus Rave 2026">
      </div>

      <div class="field">
        <label>Campus / Location *</label>
        <select id="eventCampus" required>
          <option>SDU, Ozoro</option>
          <option>SDU, Orerokpe</option>
          <option>DELSU, Abraka</option>
          <option>DOU, Asaba</option>
          <option>FUPRE, Warri</option>
          <option>UNIDEL, Agbor</option>
          <option>Other / Off-Campus</option>
        </select>
      </div>

      <div class="field">
        <label>Venue Description *</label>
        <input type="text" id="eventVenue" required placeholder="e.g. Main Auditorium / Club Oxygen">
      </div>

      <div class="field">
        <label>Category *</label>
        <select id="eventCategory" required>
          <option>Music & Nightlife</option>
          <option>Comedy</option>
          <option>Campus Carnival</option>
          <option>House Party</option>
          <option>Game Fest/ Tournament</option>
          <option>Departmental Events</option>
          <option>Other</option>
        </select>
      </div>

      <div class="field">
        <label>Date *</label>
        <input type="date" id="eventDate" required>
      </div>

      <div class="field">
        <label>Event Description</label>
        <textarea id="eventDesc" rows="3" placeholder="Tell attendees what to expect..."></textarea>
      </div>

      <!-- DYNAMIC TIER BUILDER SECTION -->
      <div class="field">
        <label>Ticket & Table Pricing Tiers *</label>
        <div class="tier-builder" id="tierContainer"></div>
        <button type="button" class="secondary" onclick="addTierRow()" style="margin-top:8px">＋ Add Ticket / Table Tier</button>
      </div>

      <button type="submit" style="width:100%;margin-top:12px;font-size:16px">Publish Event & Tiers</button>
    </form>
  </div>

  <div class="footer">Tag Line • Seamless Access</div>
</div>

<script>
  const SUPABASE_URL = 'https://ylbqwgigsvdrglgjcpyu.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlsYnF3Z2lnc3ZkcmdsZ2pjcHl1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2NDQ1OTUsImV4cCI6MjEwODIyMDU5NX0.VjhL9UjElDZTdyjM3tX7qnk-8U_Qgrehq6yxkeVLELw';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const menuToggle = document.getElementById('menuToggle');
  const navLinksEl = document.getElementById('navLinks');
  if (menuToggle && navLinksEl) {
    menuToggle.addEventListener('click', () => {
      navLinksEl.classList.toggle('active');
      menuToggle.textContent = navLinksEl.classList.contains('active') ? '✕' : '☰';
    });
  }

  // Tier Options List
  const tierOptions = [
    'Regular Pass',
    'VIP / Premium Pass',
    'Table for 4',
    'Table for 5',
    'Table for 6',
    'Table for 7',
    'Table for 8',
    'Table for 9',
    'Table for 10'
  ];

  function addTierRow(defaultType = 'Regular Pass', defaultPrice = 0) {
    const container = document.getElementById('tierContainer');
    const div = document.createElement('div');
    div.className = 'tier-row';

    let optionsHTML = tierOptions.map(opt => `<option value="${opt}" ${opt === defaultType ? 'selected' : ''}>${opt}</option>`).join('');

    div.innerHTML = `
      <select class="tier-type" required>${optionsHTML}</select>
      <input type="number" class="tier-price" placeholder="Price (₦) - 0 for Free" min="0" value="${defaultPrice}" required>
      <button type="button" class="remove-tier" onclick="this.parentElement.remove()" title="Remove Tier">✕</button>
    `;
    container.appendChild(div);
  }

  // Pre-load default tiers
  addTierRow('Regular Pass', 0);

  document.getElementById('createEventForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    let user = null;
    try { user = JSON.parse(localStorage.getItem('cv_user') || 'null'); } catch(err) {}
    if (!user) {
      alert('Please log in first.');
      window.location.href = 'login.html';
      return;
    }

    // Extract all created tiers
    const typeElements = document.querySelectorAll('.tier-type');
    const priceElements = document.querySelectorAll('.tier-price');
    const tiers = [];
    let minPrice = Infinity;

    typeElements.forEach((el, index) => {
      const type = el.value;
      const price = Number(priceElements[index].value) || 0;
      tiers.push({ name: type, price: price });
      if (price < minPrice) minPrice = price;
    });

    if (minPrice === Infinity) minPrice = 0;

    const newEvent = {
      name: document.getElementById('eventName').value.trim(),
      campus: document.getElementById('eventCampus').value,
      venue: document.getElementById('eventVenue').value.trim(),
      category: document.getElementById('eventCategory').value,
      date: document.getElementById('eventDate').value,
      desc: document.getElementById('eventDesc').value.trim(),
      price: minPrice, // Store starting price for list cards
      tiers: tiers,    // Save JSON array of tiers
      organizer: user.nickname || user.name || 'Organizer'
    };

    const { data, error } = await supabaseClient.from('events').insert([newEvent]);

    if (error) {
      alert('Error creating event: ' + error.message);
    } else {
      alert('Event published successfully with custom ticket tiers!');
      window.location.href = 'index.html';
    }
  });
</script>
</body>
</html>
