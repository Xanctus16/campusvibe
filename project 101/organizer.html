<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusVibe — Create Campus Event</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0c1020;--panel:#151b30;--panel2:#1c2440;--text:#f4f6ff;--muted:#aeb8d4;--accent:#ff7b36;--green:#61d6a4;--line:#2b3454}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 80% 0,#25204d 0,transparent 35%),var(--bg);font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--text);min-height:100vh}
a{text-decoration:none}
button,input,select,textarea{font:inherit}
button,.btn{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;font-weight:750;background:var(--accent);color:#20120b;display:inline-block;width:100%}
button:hover,.btn:hover{filter:brightness(1.08)}
.wrap{max-width:1280px;margin:auto;padding:20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;letter-spacing:-.5px;cursor:pointer;flex-shrink:0}
.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--accent),#ffcb69);display:grid;place-items:center;color:#261306;font-size:21px}
.brand small{display:block;font-size:10px;letter-spacing:1.6px;color:var(--muted);font-weight:700}

/* Standardized Compact Navigation Header */
.nav{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.nav a{background:transparent;color:var(--muted);padding:8px 12px;border-radius:12px;font-weight:750;display:inline-flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;border:1px solid transparent;transition:all 0.2s;white-space:nowrap;line-height:1.2}
.nav a:hover{color:var(--text);border-color:var(--line);background:var(--panel2)}
.nav a.active{background:var(--panel2);color:white;border-color:var(--line)}
.nav a.logout-btn{color:#ffb38b;border-color:rgba(255,123,54,0.2)}
.nav a.logout-btn:hover{background:rgba(255,123,54,0.1)}

.form-box{max-width:620px;margin:30px auto;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:32px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:12px;color:var(--muted);font-weight:750}
.field input,.field select,.field textarea{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--text);outline:none;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.footer{color:#7782a4;font-size:12px;text-align:center;padding:40px 0 10px}

/* Toast Notification Banner */
.cv-toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.cv-toast { pointer-events: auto; background: rgba(21, 27, 48, 0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 18px; padding: 14px 18px; min-width: 300px; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: flex-start; gap: 12px; animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; position: relative; }
.cv-toast-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line); display: grid; place-items: center; font-size: 18px; flex-shrink: 0; }
.cv-toast-content { flex: 1; }
.cv-toast-tag { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: var(--green); margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
.cv-toast-tag::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--green); display: inline-block; box-shadow: 0 0 8px var(--green); }
.cv-toast-title { font-size: 13px; font-weight: 700; color: var(--text); margin: 0 0 2px 0; }
.cv-toast-time { font-size: 10px; color: var(--muted); font-weight: 600; }
.cv-toast-close { background: transparent; border: 0; color: var(--muted); font-size: 18px; padding: 0; cursor: pointer; line-height: 1; }
@keyframes slideIn { from { opacity: 0; transform: translateY(-20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes slideOut { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(-20px) scale(0.95); } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a href="index.html" class="brand">
      <div class="logo">✦</div>
      <div>CampusVibe <small>YOUR CAMPUS. YOUR SCENE.</small></div>
    </a>
    <nav class="nav" id="navLinks"></nav>
  </header>

  <div class="form-box">
    <h2 style="margin:0 0 6px">＋ Host a Campus Event</h2>
    <p style="color:var(--muted);font-size:13px;margin:0 0 24px">Publish your show, party, or tournament directly to the main feed.</p>

    <form id="createEventForm">
      <div class="field">
        <label>Event Name *</label>
        <input type="text" id="eventName" required placeholder="e.g. SDU Rave Night or Gaming Finals">
      </div>
      <div class="field">
        <label>Campus Location *</label>
        <select id="eventCampus" required>
          <option>SDU, Ozoro</option>
          <option>SDU, Orerokpe</option>
          <option>DELSU, Abraka</option>
          <option>DOU, Asaba</option>
          <option>FUPRE, Warri</option>
          <option>UNIDEL, Agbor</option>
          <option>Other / Off-campus</option>
        </select>
      </div>
      <div class="field">
        <label>Venue Description *</label>
        <input type="text" id="eventVenue" required placeholder="e.g. ETF Hall B or Student Center">
      </div>
      <div class="field">
        <label>Event Date *</label>
        <input type="date" id="eventDate" required>
      </div>
      <div class="field">
        <label>Category *</label>
        <select id="eventCategory" required>
      <option value="all">All categories</option>
      <option>Music & Nightlife</option>
      <option>Comedy</option>
      <option>Academic Events</option>
      <option>Pagentry & Festival</option>
      <option>Sports Competition</option>
      <option>House Party</option>
      <option>Campus Carnival</option>
      <option>Picnic</option>
      <option>Rave/Carnival</option>
      <option>Food Fest</option>
      <option>Game Fest/ Tournament</option>
      <option>Departmental Events</option>
      <option>Faculty Events</option>
      <option>Career/Serminar</option>
        </select>
      </div>
      <div class="field">
        <label>Ticket Price (₦) [0 for Free] *</label>
        <input type="number" id="eventPrice" min="0" value="0" required>
      </div>
      <div class="field">
        <label>Description (Optional)</label>
        <textarea id="eventDesc" rows="3" placeholder="Tell students about the vibe, dress code, or DJs..."></textarea>
      </div>
      <button type="submit">Publish Live Event 🚀</button>
    </form>
  </div>

  <div class="footer">CampusVibe • Connected to Supabase Database</div>
</div>

<script>
  const SUPABASE_URL = 'https://ylbqwgigsvdrglgjcpyu.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlsYnF3Z2lnc3ZkcmdsZ2pjcHl1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2NDQ1OTUsImV4cCI6MjEwODIyMDU5NX0.VjhL9UjElDZTdyjM3tX7qnk-8U_Qgrehq6yxkeVLELw';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showToast(badgeText, title, icon = '✦') {
    let container = document.getElementById('toastContainer');
    if (!container) {
      container = document.createElement('div');
      container.id = 'toastContainer';
      container.className = 'cv-toast-container';
      document.body.appendChild(container);
    }

    const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const toast = document.createElement('div');
    toast.className = 'cv-toast';
    
    toast.innerHTML = `
      <div class="cv-toast-icon">${icon}</div>
      <div class="cv-toast-content">
        <div class="cv-toast-tag">${badgeText}</div>
        <div class="cv-toast-title">${title}</div>
        <div class="cv-toast-time">${now}</div>
      </div>
      <button class="cv-toast-close" onclick="this.parentElement.remove()">×</button>
    `;

    container.appendChild(toast);

    setTimeout(() => {
      toast.style.animation = 'slideOut 0.3s forwards';
      setTimeout(() => toast.remove(), 300);
    }, 5000);
  }

  const pendingToast = JSON.parse(sessionStorage.getItem('cv_flash_toast') || 'null');
  if (pendingToast) {
    showToast(pendingToast.tag, pendingToast.msg, pendingToast.icon);
    sessionStorage.removeItem('cv_flash_toast');
  }

  function renderNavbar() {
    let user = null;
    try { user = JSON.parse(localStorage.getItem('cv_user') || 'null'); } catch(e) { user = null; }

    if (!user || user.role !== 'organizer') {
      sessionStorage.setItem('cv_flash_toast', JSON.stringify({
        tag: 'ACCESS RESTRICTED',
        msg: 'Organizer access required.',
        icon: '🔐'
      }));
      window.location.href = 'login.html';
      return;
    }

    const nav = document.getElementById('navLinks');
    if (!nav) return;

    nav.innerHTML = `
      <a href="index.html">Discover</a>
      <a href="tickets.html">My Tickets</a>
      <a href="organizers.html">Organizers</a>
      <a href="organizer_dashboard.html">My Dashboard</a>
      <a href="organizer.html" class="active">＋ Create Event</a>
      <a href="verify.html">Scan Tickets</a>
      <a href="#" onclick="logout()" class="logout-btn">Logout (${esc(user.nickname)})</a>
    `;
  }

  function logout() {
    localStorage.removeItem('cv_user');
    supabaseClient.auth.signOut();
    sessionStorage.setItem('cv_flash_toast', JSON.stringify({
      tag: 'AUTHENTICATION',
      msg: 'Logged out successfully.',
      icon: '🔒'
    }));
    window.location.href = 'login.html';
  }

  function esc(s){ return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  document.getElementById('createEventForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    let user = JSON.parse(localStorage.getItem('cv_user') || 'null');

    const name = document.getElementById('eventName').value.trim();
    const campus = document.getElementById('eventCampus').value;
    const venue = document.getElementById('eventVenue').value.trim();
    const date = document.getElementById('eventDate').value;
    const category = document.getElementById('eventCategory').value;
    const price = document.getElementById('eventPrice').value;
    const desc = document.getElementById('eventDesc').value.trim();

    const { error } = await supabaseClient.from('events').insert([
      {
        name,
        campus,
        venue,
        date,
        category,
        price,
        desc,
        organizer: user.nickname || user.name || 'Campus Host'
      }
    ]);

    if (error) {
      showToast('ERROR CREATING EVENT', error.message, '⚠️');
      return;
    }

    sessionStorage.setItem('cv_flash_toast', JSON.stringify({
      tag: 'EVENT CREATED',
      msg: `"${name}" is now live on the discover feed!`,
      icon: '🎉'
    }));

    window.location.href = 'index.html';
  });

  renderNavbar();
</script>
</body>
</html>
