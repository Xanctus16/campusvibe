<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusVibe — My Tickets</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0c1020;--panel:#151b30;--panel2:#1c2440;--text:#f4f6ff;--muted:#aeb8d4;--accent:#ff7b36;--line:#2b3454;--green:#61d6a4}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#25204d 0,transparent 35%),var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--text)}
a{text-decoration:none;color:inherit}
.wrap{max-width:1180px;margin:auto;padding:20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0 22px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px}
.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--accent),#ffcb69);display:grid;place-items:center;color:#261306;font-size:21px}
.brand small{display:block;font-size:10px;letter-spacing:1.6px;color:var(--muted);font-weight:700}
.nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.nav a{padding:10px 14px;border-radius:12px;color:var(--muted);font-weight:700}
.nav a.active{background:var(--panel2);color:white}
.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:28px 0 14px}
.ticket{background:#fff;color:#171827;border-radius:18px;padding:20px;max-width:420px;margin:14px 0;position:relative}
.ticketlogo{font-weight:950;color:#ea672f;font-size:12px;margin-bottom:8px;display:flex;justify-content:space-between}
.badge{padding:4px 8px;border-radius:6px;font-size:10px;font-weight:800;text-transform:uppercase}
.badge.valid{background:#e6f7f0;color:#108a55}
.badge.used{background:#ffebe6;color:#d9381e}
.empty{padding:32px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}
.footer{color:#7782a4;font-size:12px;text-align:center;padding:30px 0 10px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a href="index.html" class="brand">
      <div class="logo">✦</div>
      <div>CampusVibe <small>YOUR CAMPUS. YOUR SCENE.</small></div>
    </a>
    <nav class="nav">
      <a href="index.html">Discover</a>
      <a href="tickets.html" class="active">My tickets</a>
      <a href="organizers.html">Organizers</a>
      <a href="#" onclick="logout()" style="color:#ffb38b">Logout</a>
    </nav>
  </header>

  <div class="sectionhead">
    <div><h2>My tickets</h2><p>Your saved ticket passes.</p></div>
  </div>

  <div id="ticketList"></div>

  <div class="footer">CampusVibe • Connected to Supabase Database</div>
</div>

<script>
  // 1. Route Security Check
  let user = null;
  try {
    user = JSON.parse(localStorage.getItem('cv_user') || 'null');
  } catch(e) { user = null; }

  if (!user) {
    window.location.href = 'login.html';
  }

  const SUPABASE_URL = 'https://ylbqwgigsvdrglgjcpyu.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlsYnF3Z2lnc3ZkcmdsZ2pjcHl1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDY3ODkwMDAsImV4cCI6MjAyMjM2NTAwMH0.placeholder'; // Ensure your copied anon key is pasted here
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function logout() {
    localStorage.removeItem('cv_user');
    supabaseClient.auth.signOut();
    window.location.href = 'index.html';
  }

  function niceDate(d){ return !d ? 'Date TBA' : new Date(d+'T12:00:00').toLocaleDateString('en-NG',{day:'numeric',month:'short',year:'numeric'}); }
  function esc(s){ return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  function renderTickets(){
    let tickets = JSON.parse(localStorage.getItem('cv_tickets') || '[]');
    let box = document.getElementById('ticketList');

    if(!tickets.length){
      box.innerHTML = '<div class="empty">No tickets booked yet. Check out events on the <a href="index.html" style="color:var(--accent)">Discover</a> page!</div>';
      return;
    }

    box.innerHTML = tickets.slice().reverse().map(t=>`
      <div class="ticket">
        <div class="ticketlogo">
          <span>CAMPUSVIBE / TICKET PASS</span>
          <span class="badge ${t.status === 'used' ? 'used' : 'valid'}">${t.status === 'used' ? 'USED' : 'VALID'}</span>
        </div>
        <h2 style="margin:0 0 10px">${esc(t.name)}</h2>
        <p style="margin:0;color:#444">
          📅 ${niceDate(t.date)}<br>
          📍 ${esc(t.venue)}<br>
          🎓 ${esc(t.campus)}<br>
          Reference Code: <strong>${esc(t.id)}</strong>
        </p>
      </div>`).join('');
  }

  renderTickets();
</script>
</body>
</html>
